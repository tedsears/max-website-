<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Odds Lab: Monte Carlo card game simulator</title>
  <meta name="description" content="Monte Carlo odds and best plays for Texas Hold'em, Omaha, Stud, Draw, Blackjack, Video Poker, Three Card Poker and Baccarat.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Card Odds Lab</h1>
    <p>Monte Carlo simulation: deal the rest of the hand thousands of times, count what happens, and find the best play.</p>
  </header>
  <nav id="tabs" class="tabs" aria-label="Games"></nav>
  <main>
    <section id="form" class="panel" aria-label="Your situation"></section>
    <section id="results" class="panel results" aria-live="polite"></section>
  </main>
  <footer>
    <p>Built for learning probability. Casino games still have a house edge; the simulator shows how big it is, not how to beat it.</p>
  </footer>
  <script type="module" src="js/app.js"></script>
  <noscript>This site needs JavaScript to run the simulations.</noscript>
</body>
</html>
